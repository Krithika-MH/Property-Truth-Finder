services:
  - type: web
    name: property-truth-finder
    env: python
    buildCommand: "pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: TINYFISH_API_KEY
        sync: false
      - key: TINYFISH_BASE_URL
        value: https://agent.tinyfish.ai
      - key: TINYFISH_MOCK
        value: "0"
      - key: MAX_CONCURRENT_RUNS
        value: "3"
      - key: INVESTIGATION_TIMEOUT_SECONDS
        value: "600"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-3-5-sonnet-20241022
      - key: LLM_API_KEY
        sync: false
      - key: MANUAL_BASELINE_MINUTES
        value: "45"
      - key: DATA_DIR
        value: ./data
    healthCheckPath: /api/health
